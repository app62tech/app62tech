name: CI

# Quality gate only. Deploys are handled by Cloudflare's Git integration
# (Workers Builds) on every push to main.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, typecheck, and accessibility gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Type-check
        run: npx astro check

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility gate (axe-core, WCAG 2.2 AA)
        run: npm run test:a11y

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          # Every page is prerendered, so a plain static server against
          # `dist/` is representative of what actually ships (PRD §5, §19).
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
